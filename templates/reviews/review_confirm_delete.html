{% extends 'base.html' %}

{% block title %}Delete Review{% endblock %}

{% block content %}
<h1>Delete Review</h1>
<p>Are you sure you want to delete your review for "{{ review.book.title }}"?</p>

<form method="post">
    {% csrf_token %}
    <button type="submit">Yes, Delete</button>
    <a href="{% url 'book_detail' review.book.pk %}">Cancel</a>
</form>
{% endblock %}
