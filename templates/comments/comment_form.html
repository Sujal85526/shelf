{% extends 'base.html' %}

{% block title %}Add Comment{% endblock %}

{% block content %}
<h1>Add Comment to Review</h1>

<form method="post">
    {% csrf_token %}
    {{ form.as_p }}
    <button type="submit">Post Comment</button>
    <a href="{% url 'book_detail' review.book.pk %}">Cancel</a>
</form>
{% endblock %}
