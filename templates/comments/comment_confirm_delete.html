{% extends 'base.html' %}

{% block title %}Delete Comment{% endblock %}

{% block content %}
<h1>Delete Comment</h1>
<p>Are you sure you want to delete this comment?</p>

<form method="post">
    {% csrf_token %}
    <button type="submit">Yes, Delete</button>
    <a href="{% url 'book_detail' comment.review.book.pk %}">Cancel</a>
</form>
{% endblock %}
