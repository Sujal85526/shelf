<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shelf - {% block title %}Book Reviews{% endblock %}</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: Arial, sans-serif; line-height: 1.6; padding: 20px; }
        nav { background: #333; color: white; padding: 15px; margin-bottom: 20px; }
        nav a { color: white; margin-right: 15px; text-decoration: none; }
        nav a:hover { text-decoration: underline; }
        .container { max-width: 1200px; margin: 0 auto; }
        .messages { padding: 10px; margin-bottom: 20px; border-radius: 4px; }
        .messages.success { background: #d4edda; color: #155724; }
        .messages.error { background: #f8d7da; color: #721c24; }
        .messages.info { background: #d1ecf1; color: #0c5460; }
    </style>
</head>
<body>
    <nav>
        <a href="{% url 'book_list' %}">Home</a>
        {% if user.is_authenticated %}
            <span style="float: right;">
                <span>Hi, {{ user.username }}</span>
                <a href="{% url 'logout' %}">Logout</a>
            </span>
        {% else %}
            <span style="float: right;">
                <a href="{% url 'login' %}">Login</a>
                <a href="{% url 'signup' %}">Sign Up</a>
            </span>
        {% endif %}
    </nav>

    <div class="container">
        {% if messages %}
            {% for message in messages %}
                <div class="messages {{ message.tags }}">{{ message }}</div>
            {% endfor %}
        {% endif %}

        {% block content %}
        {% endblock %}
    </div>
</body>
</html>
